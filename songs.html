<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b5bd6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1020" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Songs</title>
    <style>
:root {
  color-scheme: light dark;
  --bg: #eef1f9;
  --bg-grad-1: #e9ecfb;
  --bg-grad-2: #eef4f3;
  --surface: #ffffff;
  --panel: #ffffff;
  --panel-2: #f6f7fc;
  --ink: #191d33;
  --ink-soft: #3b4162;
  --muted: #6c7392;
  --line: #e4e7f2;
  --line-strong: #d3d8e8;
  --accent: #5b5bd6;
  --accent-strong: #4a45c7;
  --accent-ink: #ffffff;
  --accent-soft: #ecebfb;
  --accent-soft-ink: #4038b8;
  --good: #12855f;
  --bad: #d1495b;
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(24, 30, 60, 0.06), 0 2px 6px rgba(24, 30, 60, 0.05);
  --shadow: 0 10px 30px rgba(30, 38, 80, 0.10), 0 2px 8px rgba(30, 38, 80, 0.05);
  --ring: 0 0 0 4px rgba(91, 91, 214, 0.22);
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1020;
    --bg-grad-1: #12132a;
    --bg-grad-2: #101a22;
    --surface: #181b2e;
    --panel: #181b2e;
    --panel-2: #1f2338;
    --ink: #eef0fb;
    --ink-soft: #c7cbe6;
    --muted: #9aa1c6;
    --line: #2a2f49;
    --line-strong: #363c5c;
    --accent: #8888f2;
    --accent-strong: #9c9cf6;
    --accent-ink: #12132a;
    --accent-soft: #24284a;
    --accent-soft-ink: #c3c3fb;
    --good: #43c993;
    --bad: #f2788c;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
    --ring: 0 0 0 4px rgba(136, 136, 242, 0.28);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(1100px 620px at 12% -8%, var(--bg-grad-1), transparent 60%),
    radial-gradient(1000px 560px at 100% 0%, var(--bg-grad-2), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: var(--ink); }

button {
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  min-height: 44px;
  padding: 0 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
button:hover { border-color: var(--accent); color: var(--accent-strong); }
button:active { transform: translateY(1px); }
button:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }
button:focus-visible { outline: none; box-shadow: var(--ring); }

.primary {
  border-color: transparent;
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color: var(--accent-ink);
  box-shadow: 0 6px 16px rgba(74, 69, 199, 0.28);
}
.primary:hover { color: var(--accent-ink); filter: brightness(1.05); border-color: transparent; }

.shell {
  width: min(900px, calc(100vw - 28px));
  margin: 0 auto;
  padding: clamp(18px, 4vw, 40px) 0 56px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
h1 { margin: 0; font-size: clamp(1.6rem, 4.5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  text-transform: uppercase; letter-spacing: 0.09em; font-size: 0.7rem; font-weight: 700;
  color: var(--accent-soft-ink); background: var(--accent-soft);
  padding: 5px 11px; border-radius: var(--radius-pill); margin: 0 0 8px;
}
.who { color: var(--muted); font-size: 0.85rem; }

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: clamp(18px, 3vw, 28px);
}

.screen { display: none; }
.screen.active { display: block; animation: fade 0.18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

/* ---------- sign in ---------- */
.signin { text-align: center; display: grid; gap: 16px; place-items: center; padding: 32px 16px; }
.signin p { margin: 0; color: var(--muted); max-width: 40ch; }

/* ---------- language chips ---------- */
.langs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.lang-chip {
  min-height: 40px; padding: 0 15px; border-radius: var(--radius-pill);
  background: var(--panel-2); border-color: var(--line); font-size: 0.9rem;
}
.lang-chip.active {
  background: var(--accent-soft); color: var(--accent-strong);
  border-color: var(--accent); font-weight: 700;
}

/* ---------- song list ---------- */
.song-list { display: grid; gap: 10px; }
.song-card {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel-2); padding: 14px 16px;
  text-align: left; width: 100%; min-height: 0;
}
.song-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.song-card .info { min-width: 0; flex: 1 1 auto; }
.song-card .name { display: block; font-weight: 700; font-size: 1.05rem; }
.song-card .meta { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: var(--radius-pill);
  font-size: 0.75rem; font-weight: 650; white-space: nowrap;
  background: var(--accent-soft); color: var(--accent-soft-ink);
}
.empty { color: var(--muted); text-align: center; padding: 28px 12px; margin: 0; }

/* ---------- song view ---------- */
.song-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.song-title { margin: 0; font-size: 1.3rem; font-weight: 800; }
.progress { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }

.mode-switch {
  display: flex; gap: 2px; padding: 4px; margin-bottom: 16px;
  border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--panel-2);
}
.mode-switch button {
  flex: 1; min-height: 38px; border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--muted); font-weight: 650; padding: 0 12px;
}
.mode-switch button.active { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow-sm); }

.media-wrap { display: grid; gap: 8px; margin-bottom: 16px; }
.media-wrap[hidden] { display: none; }
video {
  width: 100%; max-height: 36vh; border-radius: var(--radius); background: #000;
}
.media-note { color: var(--muted); font-size: 0.85rem; }

.line-original {
  font-size: clamp(1.4rem, 5vw, 2.3rem);
  font-weight: 750; line-height: 1.35; margin: 0;
  overflow-wrap: normal; word-break: normal;
}
.line-translation {
  font-size: clamp(1.4rem, 5vw, 2.3rem);
  font-weight: 750; line-height: 1.35; margin: 14px 0 0;
  color: var(--good);
  padding-top: 14px; border-top: 1px solid var(--line);
  animation: fade 0.15s ease;
}
.line-translation[hidden] { display: none; }

.tap-word { cursor: pointer; border-radius: 6px; padding: 0 0.06em; white-space: nowrap; transition: background 0.12s ease, color 0.12s ease; }
.tap-word:hover, .tap-word:active { background: var(--accent-soft); color: var(--accent-strong); }

.gloss {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel-2); padding: 10px 14px; margin-top: 12px; font-size: 1.05rem;
  animation: fade 0.14s ease;
}
.gloss[hidden] { display: none; }
.gloss strong { color: var(--accent-strong); }

.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.controls button { flex: 1 1 140px; min-height: 52px; }
.speak-btn {
  min-height: 36px; padding: 0 14px; margin-top: 10px;
  border-radius: var(--radius-pill); background: var(--panel-2);
  border-color: var(--line); color: var(--ink-soft); font-size: 0.88rem;
}
.speak-btn[hidden] { display: none; }

.status { color: var(--muted); font-size: 0.9rem; min-height: 1.2em; margin: 10px 0 0; }
.back-btn { margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <!-- ============ SIGN IN ============ -->
      <section id="signinScreen" class="screen active">
        <div class="panel signin">
          <p class="eyebrow">Songs</p>
          <h1>Your songs</h1>
          <p>Sign in with the same Google account you use in the Language Trainer to see all your songs, listen along, and go over them line by line.</p>
          <button id="signInButton" class="primary" type="button">Sign in with Google</button>
          <p id="signinStatus" class="status"></p>
        </div>
      </section>

      <!-- ============ LIBRARY ============ -->
      <section id="libraryScreen" class="screen">
        <div class="topbar">
          <div>
            <p class="eyebrow">Songs</p>
            <h1>Your songs</h1>
          </div>
          <div style="text-align:right">
            <div id="whoami" class="who"></div>
            <button id="signOutButton" type="button" style="min-height:36px;margin-top:6px">Sign out</button>
          </div>
        </div>
        <div class="panel">
          <div id="langs" class="langs"></div>
          <div id="songList" class="song-list"></div>
          <p id="libraryStatus" class="status"></p>
        </div>
      </section>

      <!-- ============ ONE SONG ============ -->
      <section id="songScreen" class="screen">
        <button id="backButton" class="back-btn" type="button">← All songs</button>
        <div class="panel">
          <div class="song-head">
            <h2 id="songTitle" class="song-title"></h2>
            <span id="songProgress" class="progress"></span>
          </div>

          <div class="mode-switch" role="group" aria-label="How to study">
            <button id="listenModeButton" type="button">🎵 Listen</button>
            <button id="lineModeButton" type="button">📖 Line by line</button>
          </div>

          <div id="mediaWrap" class="media-wrap" hidden>
            <video id="media" playsinline controls></video>
            <p id="mediaNote" class="media-note"></p>
          </div>

          <p id="lineOriginal" class="line-original"></p>
          <button id="speakOriginal" class="speak-btn" type="button" hidden>🔊 Hear it</button>
          <div id="gloss" class="gloss" aria-live="polite" hidden></div>
          <p id="lineTranslation" class="line-translation" hidden></p>
          <button id="speakTranslation" class="speak-btn" type="button" hidden>🔊 Hear translation</button>

          <div class="controls">
            <button id="revealButton" class="primary" type="button">Show translation</button>
            <button id="nextButton" class="primary" type="button" hidden>Next →</button>
            <button id="restartButton" type="button" hidden>Start again</button>
          </div>
          <p id="songStatus" class="status"></p>
        </div>
      </section>
    </main>

    <script>
// ---------------------------------------------------------------------------
// Songs — a focused companion to the Language Trainer.
// Reads the same Firebase account and the same cloud document, but shows only
// the songs (texts) from each language setup: listen along, or go line by line.
// ---------------------------------------------------------------------------

const FIREBASE_MODULE_VERSION = "12.15.0";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDCHhuwbnIOfCf49i44kvHJYwyJoVvVGBw",
  authDomain: "translate-5e2b4.firebaseapp.com",
  projectId: "translate-5e2b4",
  storageBucket: "translate-5e2b4.firebasestorage.app",
  messagingSenderId: "719326318291",
  appId: "1:719326318291:web:1e9976a4fd22febac20e26",
};
// The trainer caches song media here; same origin, so we can reuse it.
const MEDIA_DB_NAME = "vocabulary-trainer-media";
const MEDIA_STORE = "media";
const TTS_RATE = 0.9;

const el = (id) => document.getElementById(id);
const ui = {
  screens: {
    signin: el("signinScreen"),
    library: el("libraryScreen"),
    song: el("songScreen"),
  },
  signInButton: el("signInButton"),
  signinStatus: el("signinStatus"),
  signOutButton: el("signOutButton"),
  whoami: el("whoami"),
  langs: el("langs"),
  songList: el("songList"),
  libraryStatus: el("libraryStatus"),
  backButton: el("backButton"),
  songTitle: el("songTitle"),
  songProgress: el("songProgress"),
  listenModeButton: el("listenModeButton"),
  lineModeButton: el("lineModeButton"),
  mediaWrap: el("mediaWrap"),
  media: el("media"),
  mediaNote: el("mediaNote"),
  lineOriginal: el("lineOriginal"),
  speakOriginal: el("speakOriginal"),
  gloss: el("gloss"),
  lineTranslation: el("lineTranslation"),
  speakTranslation: el("speakTranslation"),
  revealButton: el("revealButton"),
  nextButton: el("nextButton"),
  restartButton: el("restartButton"),
  songStatus: el("songStatus"),
};

const app = {
  modules: null,
  auth: null,
  db: null,
  user: null,
  languages: [],      // [{ id, learn, from, learnCode, fromCode, songs: [] }]
  langIndex: 0,
  song: null,         // the open song
  lines: [],          // its playable (non-header) sentences
  index: 0,
  revealed: false,
  mode: "line",       // "listen" | "line"
  mediaUrl: null,
  spokenLine: -1,
  spokenAnswer: -1,
};

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------

function showScreen(name) {
  Object.entries(ui.screens).forEach(([key, node]) => {
    node.classList.toggle("active", key === name);
  });
  window.scrollTo(0, 0);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// Accept both the old and new shapes the trainer has written over time.
function readAppState(data) {
  const raw = data?.stateJson;
  if (raw && typeof raw === "object") return raw;
  if (typeof raw === "string" && raw.trim()) {
    try { return JSON.parse(raw); } catch (error) { return {}; }
  }
  if (data?.state && typeof data.state === "object") return data.state;
  if (Array.isArray(data?.setups)) return data;
  return {};
}

function normalizeSentence(sentence) {
  return {
    source: String(sentence?.source || "").trim(),
    translation: String(sentence?.translation || "").trim(),
    header: Boolean(sentence?.header),
    time: Number.isFinite(sentence?.time) ? sentence.time : null,
    glosses: Array.isArray(sentence?.glosses)
      ? sentence.glosses
          .filter((g) => g && typeof g === "object")
          .map((g) => ({ w: String(g.w || "").trim(), t: String(g.t || "").trim() }))
          .filter((g) => g.w)
      : [],
  };
}

function buildLibrary(appState) {
  const setups = Array.isArray(appState?.setups) ? appState.setups : [];
  return setups
    .map((setup) => {
      const songs = (Array.isArray(setup?.texts) ? setup.texts : [])
        .map((text) => {
          const sentences = (Array.isArray(text?.sentences) ? text.sentences : [])
            .map(normalizeSentence)
            .filter((s) => s.source || s.translation);
          return {
            id: String(text?.id || ""),
            title: String(text?.title || "").trim(),
            hasMedia: Boolean(text?.hasMedia),
            driveFileId: String(text?.driveFileId || ""),
            drivePublic: Boolean(text?.drivePublic),
            sentences,
          };
        })
        .filter((song) => song.sentences.length);
      return {
        id: String(setup?.id || ""),
        learn: String(setup?.learnLanguage || "").trim() || "Language",
        from: String(setup?.fromLanguage || "").trim() || "Translation",
        learnCode: String(setup?.learnLanguageCode || "").trim(),
        fromCode: String(setup?.fromLanguageCode || "").trim(),
        songs,
      };
    })
    .filter((lang) => lang.songs.length);
}

function songTitle(song) {
  if (song.title) return song.title;
  const first = song.sentences.find((s) => !s.header) || song.sentences[0];
  const text = first?.source || "";
  return text ? (text.length > 40 ? `${text.slice(0, 40)}…` : text) : "Untitled";
}

// ---------------------------------------------------------------------------
// Speech
// ---------------------------------------------------------------------------

function stopSpeech() {
  try { window.speechSynthesis?.cancel?.(); } catch (error) { /* ignore */ }
}

function speak(text, languageCode) {
  if (!text || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(text);
  if (languageCode) utterance.lang = languageCode;
  utterance.rate = TTS_RATE;
  const voices = window.speechSynthesis.getVoices?.() || [];
  const code = (languageCode || "").toLowerCase();
  const voice = voices.find((v) => v.lang.toLowerCase() === code)
    || voices.find((v) => v.lang.toLowerCase().startsWith(`${code}-`));
  if (voice) utterance.voice = voice;
  window.setTimeout(() => {
    try { window.speechSynthesis.speak(utterance); } catch (error) { /* ignore */ }
  }, 40);
}

// ---------------------------------------------------------------------------
// Media: the trainer's local cache first, then the shared Drive copy
// ---------------------------------------------------------------------------

let mediaDbPromise = null;
function openMediaDb() {
  if (mediaDbPromise) return mediaDbPromise;
  mediaDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("No IndexedDB")); return; }
    const request = indexedDB.open(MEDIA_DB_NAME, 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(MEDIA_STORE)) {
        request.result.createObjectStore(MEDIA_STORE, { keyPath: "id" });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return mediaDbPromise;
}

async function getLocalMedia(id) {
  try {
    const db = await openMediaDb();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(MEDIA_STORE, "readonly").objectStore(MEDIA_STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (error) {
    return null;
  }
}

function releaseMediaUrl() {
  if (app.mediaUrl) {
    URL.revokeObjectURL(app.mediaUrl);
    app.mediaUrl = null;
  }
}

async function loadMedia(song) {
  releaseMediaUrl();
  // Clear handlers from the previous song, or its fallback chain can fire here.
  ui.media.onerror = null;
  ui.media.onloadeddata = null;
  ui.media.removeAttribute("src");
  ui.media.load();
  ui.mediaNote.textContent = "";

  const local = song.hasMedia ? await getLocalMedia(song.id) : null;
  if (local?.blob) {
    app.mediaUrl = URL.createObjectURL(local.blob);
    ui.media.src = app.mediaUrl;
    ui.mediaWrap.hidden = false;
    return true;
  }

  if (song.driveFileId) {
    // Public Drive files stream straight into a <video> with no sign-in.
    const id = encodeURIComponent(song.driveFileId);
    const sources = [
      `https://drive.usercontent.google.com/download?id=${id}&export=download`,
      `https://drive.google.com/uc?export=download&id=${id}`,
    ];
    let step = 0;
    const tryNext = () => {
      if (step >= sources.length) {
        ui.media.onerror = null;
        ui.mediaNote.textContent = "The audio could not be loaded — the words still work.";
        return;
      }
      ui.media.src = sources[step];
      step += 1;
    };
    ui.media.onerror = tryNext;
    ui.media.onloadeddata = () => { ui.mediaNote.textContent = ""; };
    ui.mediaNote.textContent = "Loading the audio…";
    tryNext();
    ui.mediaWrap.hidden = false;
    return true;
  }

  ui.mediaWrap.hidden = true;
  return false;
}

// ---------------------------------------------------------------------------
// Sign in
// ---------------------------------------------------------------------------

async function loadFirebase() {
  if (app.modules) return app.modules;
  const [appModule, authModule, firestoreModule] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${FIREBASE_MODULE_VERSION}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${FIREBASE_MODULE_VERSION}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${FIREBASE_MODULE_VERSION}/firebase-firestore.js`),
  ]);
  app.modules = { app: appModule, auth: authModule, firestore: firestoreModule };
  return app.modules;
}

async function initFirebase() {
  const modules = await loadFirebase();
  const existing = modules.app.getApps().find((a) => a.name === "songs-app");
  const instance = existing || modules.app.initializeApp(FIREBASE_CONFIG, "songs-app");
  app.auth = modules.auth.getAuth(instance);
  app.db = modules.firestore.getFirestore(instance);
  try {
    await modules.auth.setPersistence(app.auth, modules.auth.browserLocalPersistence);
  } catch (error) { /* falls back to the default */ }
  return modules;
}

// Popup only. The redirect flow needs storage shared with the Firebase auth
// domain, which Safari (and Chrome with third-party cookies blocked) partitions
// away — that produces "missing initial state" and never signs you in.
async function signIn() {
  ui.signInButton.disabled = true;
  ui.signinStatus.textContent = "Opening Google sign-in…";
  try {
    const modules = await initFirebase();
    const provider = new modules.auth.GoogleAuthProvider();
    await modules.auth.signInWithPopup(app.auth, provider);
    ui.signinStatus.textContent = "";
  } catch (error) {
    const code = String(error?.code || "");
    console.warn("Sign-in failed.", error);
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
      ui.signinStatus.textContent = "Sign-in was cancelled.";
    } else if (code === "auth/popup-blocked") {
      ui.signinStatus.textContent =
        "Your browser blocked the sign-in window. Allow pop-ups for this site, then tap the button again.";
    } else {
      ui.signinStatus.textContent = `Could not sign in: ${error?.message || error}`;
    }
  } finally {
    ui.signInButton.disabled = false;
  }
}

async function signOut() {
  try {
    await app.modules.auth.signOut(app.auth);
  } catch (error) { /* ignore */ }
  app.languages = [];
  showScreen("signin");
  ui.signinStatus.textContent = "";
}

// ---------------------------------------------------------------------------
// Library
// ---------------------------------------------------------------------------

async function loadLibrary() {
  ui.libraryStatus.textContent = "Loading your songs…";
  try {
    const { firestore } = app.modules;
    const ref = firestore.doc(app.db, "users", app.user.uid, "trainer", "state");
    const snapshot = await firestore.getDoc(ref);
    if (!snapshot.exists()) {
      app.languages = [];
      ui.libraryStatus.textContent = "No data found for this account yet.";
      renderLibrary();
      return;
    }
    app.languages = buildLibrary(readAppState(snapshot.data()));
    ui.libraryStatus.textContent = "";
    app.langIndex = 0;
    renderLibrary();
  } catch (error) {
    console.warn("Could not load songs.", error);
    ui.libraryStatus.textContent = `Could not load your songs: ${error?.message || error}`;
  }
}

function renderLibrary() {
  ui.whoami.textContent = app.user?.email || app.user?.displayName || "";
  ui.langs.innerHTML = "";
  ui.songList.innerHTML = "";

  if (!app.languages.length) {
    ui.songList.innerHTML = '<p class="empty">No songs yet. Add them in the Language Trainer and they will appear here.</p>';
    return;
  }

  app.langIndex = Math.min(app.langIndex, app.languages.length - 1);

  // One chip per language setup, so you can jump between languages.
  app.languages.forEach((lang, i) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = i === app.langIndex ? "lang-chip active" : "lang-chip";
    chip.textContent = `${lang.learn} → ${lang.from} (${lang.songs.length})`;
    chip.addEventListener("click", () => {
      app.langIndex = i;
      renderLibrary();
    });
    ui.langs.append(chip);
  });

  const current = app.languages[app.langIndex];
  current.songs.forEach((song) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "song-card";

    const info = document.createElement("span");
    info.className = "info";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = songTitle(song);
    const meta = document.createElement("span");
    meta.className = "meta";
    const lines = song.sentences.filter((s) => !s.header).length;
    const timed = song.sentences.filter((s) => Number.isFinite(s.time)).length;
    meta.textContent = `${lines} line${lines === 1 ? "" : "s"}`
      + (timed ? " · synced" : "");
    info.append(name, meta);
    card.append(info);

    if (song.hasMedia || song.driveFileId) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "♪ audio";
      card.append(badge);
    }

    card.addEventListener("click", () => openSong(song, current));
    ui.songList.append(card);
  });
}

// ---------------------------------------------------------------------------
// One song
// ---------------------------------------------------------------------------

async function openSong(song, lang) {
  app.song = song;
  app.lang = lang;
  app.lines = song.sentences.filter((s) => !s.header);
  app.index = 0;
  app.revealed = false;
  app.spokenLine = -1;
  app.spokenAnswer = -1;
  ui.songTitle.textContent = songTitle(song);
  ui.gloss.hidden = true;
  ui.songStatus.textContent = "";
  document.title = songTitle(song);

  showScreen("song");
  const hasMedia = await loadMedia(song);

  // With audio and timings, following the song is the nicer default.
  app.mode = hasMedia && app.lines.some((l) => Number.isFinite(l.time)) ? "listen" : "line";
  updateModeButtons();
  renderLine();
  if (app.mode === "listen") ui.media.play().catch(() => {});
}

function updateModeButtons() {
  const canListen = !ui.mediaWrap.hidden;
  ui.listenModeButton.disabled = !canListen;
  ui.listenModeButton.classList.toggle("active", app.mode === "listen");
  ui.lineModeButton.classList.toggle("active", app.mode === "line");
}

function setMode(mode) {
  if (mode === "listen" && ui.mediaWrap.hidden) return;
  if (app.mode === mode) return;
  app.mode = mode;
  if (mode === "listen") {
    app.revealed = true;
    const pos = lineAtTime(ui.media.currentTime);
    if (pos >= 0) app.index = pos;
  } else {
    ui.media.pause();
    app.revealed = false;
    app.spokenLine = -1;
    app.spokenAnswer = -1;
  }
  updateModeButtons();
  renderLine();
}

function lineAtTime(time) {
  let pos = -1;
  for (let i = 0; i < app.lines.length; i += 1) {
    const at = app.lines[i].time;
    if (Number.isFinite(at) && at <= time + 0.02) pos = i;
    else if (Number.isFinite(at)) break;
  }
  return pos;
}

function renderTappable(container, text) {
  const frag = document.createDocumentFragment();
  String(text || "").split(/(\s+)/).forEach((token) => {
    if (!token) return;
    if (/^\s+$/.test(token)) { frag.append(token); return; }
    const span = document.createElement("span");
    span.className = "tap-word";
    span.textContent = token;
    frag.append(span);
  });
  container.replaceChildren(frag);
}

function renderLine() {
  const total = app.lines.length;
  const done = app.index >= total;
  ui.gloss.hidden = true;

  if (done) {
    ui.songProgress.textContent = `${total} / ${total}`;
    ui.lineOriginal.textContent = "🎉";
    ui.lineTranslation.hidden = true;
    ui.speakOriginal.hidden = true;
    ui.speakTranslation.hidden = true;
    ui.revealButton.hidden = true;
    ui.nextButton.hidden = true;
    ui.restartButton.hidden = false;
    return;
  }

  const line = app.lines[app.index];
  ui.songProgress.textContent = `${app.index + 1} / ${total}`;
  renderTappable(ui.lineOriginal, line.source);
  ui.restartButton.hidden = true;

  if (app.mode === "listen") {
    // Both lines stay up and change with the music; the song is the audio.
    ui.lineTranslation.textContent = line.translation || "—";
    ui.lineTranslation.hidden = false;
    ui.speakOriginal.hidden = true;
    ui.speakTranslation.hidden = true;
    ui.revealButton.hidden = true;
    ui.nextButton.hidden = true;
    return;
  }

  ui.speakOriginal.hidden = !line.source;
  if (app.revealed) {
    ui.lineTranslation.textContent = line.translation || "—";
    ui.lineTranslation.hidden = false;
    ui.speakTranslation.hidden = !line.translation;
    ui.revealButton.hidden = true;
    ui.nextButton.hidden = false;
    ui.nextButton.textContent = app.index === total - 1 ? "Finish" : "Next →";
    if (app.spokenAnswer !== app.index) {
      app.spokenAnswer = app.index;
      speak(line.translation, app.lang?.fromCode);
    }
  } else {
    ui.lineTranslation.hidden = true;
    ui.speakTranslation.hidden = true;
    ui.revealButton.hidden = false;
    ui.nextButton.hidden = true;
    if (app.spokenLine !== app.index) {
      app.spokenLine = app.index;
      speak(line.source, app.lang?.learnCode);
    }
  }
}

function showGloss(word, meaning) {
  const strong = document.createElement("strong");
  strong.textContent = word;
  ui.gloss.replaceChildren(strong, "  →  ", meaning);
  ui.gloss.hidden = false;
}

function glossWord(raw) {
  const word = String(raw || "").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "").trim();
  if (!word) return;
  const line = app.lines[app.index];
  const normalized = word.toLowerCase();
  const hit = (line?.glosses || []).find((g) => g.w.toLowerCase() === normalized);
  showGloss(word, hit ? hit.t : "(no translation for this word)");
}

function leaveSong() {
  ui.media.pause();
  releaseMediaUrl();
  ui.media.removeAttribute("src");
  ui.media.load();
  stopSpeech();
  app.song = null;
  document.title = "Songs";
  showScreen("library");
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

ui.signInButton.addEventListener("click", signIn);
ui.signOutButton.addEventListener("click", signOut);
ui.backButton.addEventListener("click", leaveSong);
ui.listenModeButton.addEventListener("click", () => setMode("listen"));
ui.lineModeButton.addEventListener("click", () => setMode("line"));

ui.revealButton.addEventListener("click", () => {
  app.revealed = true;
  renderLine();
});
ui.nextButton.addEventListener("click", () => {
  app.index += 1;
  app.revealed = false;
  renderLine();
});
ui.restartButton.addEventListener("click", () => {
  app.index = 0;
  app.revealed = app.mode === "listen";
  app.spokenLine = -1;
  app.spokenAnswer = -1;
  renderLine();
});
ui.speakOriginal.addEventListener("click", () => {
  speak(app.lines[app.index]?.source, app.lang?.learnCode);
});
ui.speakTranslation.addEventListener("click", () => {
  speak(app.lines[app.index]?.translation, app.lang?.fromCode);
});
ui.lineOriginal.addEventListener("click", (event) => {
  const span = event.target.closest(".tap-word");
  if (span) glossWord(span.textContent);
});
ui.media.addEventListener("timeupdate", () => {
  if (app.mode !== "listen" || !app.song) return;
  const pos = lineAtTime(ui.media.currentTime);
  if (pos >= 0 && pos !== app.index) {
    app.index = pos;
    app.revealed = true;
    renderLine();
  }
});

window.addEventListener("beforeunload", releaseMediaUrl);

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

(async function boot() {
  try {
    const modules = await initFirebase();
    modules.auth.onAuthStateChanged(app.auth, async (user) => {
      app.user = user || null;
      if (user) {
        showScreen("library");
        await loadLibrary();
      } else {
        showScreen("signin");
      }
    });
  } catch (error) {
    console.warn("Could not start.", error);
    ui.signinStatus.textContent = `Could not start: ${error?.message || error}`;
  }
})();
    </script>
  </body>
</html>
